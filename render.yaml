services:
  - type: web
    name: gstarshop-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: CLIENT_URL
        value: https://gstarshop-bjpz.vercel.app
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
